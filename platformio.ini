; =============================================================================
;  HLK-LD2451 24 GHz Vehicle Radar  ->  ESP32 Live Dashboard
;  PlatformIO project configuration
; =============================================================================
;  Build & flash:   pio run -t upload
;  Serial monitor:  pio device monitor        (115200 baud)
;
;  Libraries (pulled automatically by lib_deps):
;    - ESP32Async/ESPAsyncWebServer  : async HTTP server + built-in WebSocket
;    - ESP32Async/AsyncTCP           : async TCP stack required by the server
;    - bblanchon/ArduinoJson (v7)    : JSON encoding of radar frames
;  (ESP32Async is the maintained continuation of me-no-dev / mathieucarbou.)
; =============================================================================

[platformio]
default_envs = esp32dev

[env]
platform        = espressif32
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.3.0
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Larger AsyncTCP task stack: avoids stack overflows under WebSocket load
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    ; Run AsyncTCP on core 0 together with Wi-Fi; UART parser lives on core 1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

; Classic ESP32 DevKit (WROOM-32)
[env:esp32dev]
board = esp32dev

; ESP32-S3 DevKitC (GPIO16/17 are free on the S3 as well)
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
